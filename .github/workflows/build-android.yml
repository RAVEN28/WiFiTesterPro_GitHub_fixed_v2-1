name: Build APK - Full Debug

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "=== Files in repo ==="
          ls -la
          echo ""
          echo "=== buildozer.spec exists? ==="
          test -f buildozer.spec && echo "YES" || echo "NO"
          echo ""
          echo "=== main.py exists? ==="
          test -f main.py && echo "YES" || echo "NO"
          echo ""
          echo "=== buildozer.spec content ==="
          cat buildozer.spec
          echo ""
          echo "=== main.py size ==="
          wc -l main.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake autopoint libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev gettext \
            build-essential ccache || true

          # Fallback for libtinfo5 on Ubuntu 22.04
          if ! dpkg -l | grep -q libtinfo5; then
            wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb || true
            sudo dpkg -i libtinfo5_6.3-2_amd64.deb || sudo apt-get install -f -y || true
          fi

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "cython<3.0"

      - name: Verify environment
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Java ==="
          java -version
          echo "=== Buildozer ==="
          buildozer --version

      - name: Clean previous builds
        run: |
          rm -rf .buildozer bin || true

      - name: Build APK (with full log)
        run: |
          set -x
          buildozer -v android debug 2>&1 | tee build_full.log
          echo "=== EXIT CODE: $? ==="
          echo ""
          echo "=== bin/ directory: ==="
          ls -la bin/ || echo "NO bin DIRECTORY"
        continue-on-error: true

      - name: Check what was built
        if: always()
        run: |
          echo "=== Searching for APK anywhere ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== Search buildozer output ==="
          find /home/runner -name "*.apk" -type f 2>/dev/null || echo "Nothing in /home/runner"
          echo ""
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No bin/"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_full.log
          if-no-files-found: warn

      - name: Upload APK if exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
